[board]
name = "t610yp"
soc = "unisoc-ums512-sharkl5pro-t610yp"
description = "Unisoc UMS512 / SharkL5Pro T610YP bring-up"
kit = "t610yp"

[kernel]
archives = []

[payload]
volume = "UNIXNU"
size_mib = 64
loader = "firmware"
title = "UniXNU T610YP"
dram_size = "0x40000000"
panic_screen = false
timeout = 0
kernel_args = ["-v", "serial=3"]

[payload.adt]
tool = "scripts/make-t610yp-adt.py"
dram_size = "0x40000000"
owned_memory_size = "0x10000000"
psci_method = "smc"
unique_chip_id = "required"
cpu_regs = "0,0x100,0x200,0x300,0x400,0x500,0x600,0x700"

