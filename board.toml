[board]
name = "t610yp"
soc = "UMS512"
description = "Unisoc T610YP / sharkl5pro"
kit = "t610yp"

# Bring-up source image. This is the same iPadOS 17.7.11 image used by
# UniXNU-sheng; it supplies the XNU/kernelcache and iOS userland inputs.
[ipsw]
url = "https://updates.cdn-apple.com/2025SpringFCS/fullrestores/122-77166/DCA6CFE8-90E9-4B92-880D-3DE171798E40/iPad_Pro_HFR_17.7.11_21H461_Restore.ipsw"
product = "iPad7,1"
version = "17.7.11"
build = "21H461"
device_class = "j120ap"
chip_id = 0x8011
board_id = 12
fetch = ["KernelCache", "DeviceTree", "StaticTrustCache", "Cryptex1,SystemTrustCache"]

[ipsw.sha256]
"044-76040-038.dmg" = "3f99b859c9728379110b66657c7b15285bcb1925ad8b5726542e2cdcf8b1028d"
"044-76034-038.dmg" = "b4908cde41d23e6bc05e6af51a2c9eeb00cf0f863a6a18b1600c96a3fd70414f"

[kernel]
defconfig = "t610yp_defconfig"
archives = [
  "build-corecrypto-14.py",
  "build-corecrypto-14.py --namespace",
  "build-arm-driver.py ArmDTPlatform",
  "build-arm-driver.py ArmCpu",
]

[kernel.prelink]
tool = "kits/NativePrelink/emit_prelink.py"
kernel = "build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837.unstripped.noctf"
kernelcache_sha256 = "f18b4df865405f2a287b84977d7aca745e056d656d9fc9df1662970ce2969de7"
slide = "-0x1000000"
early_security_init = "com.apple.driver.AppleMobileFileIntegrity=0xfffffff005ab4ae0"
roots = [
  "com.apple.AppleFSCompression.AppleFSCompressionTypeZlib",
  "com.apple.driver.AppleARMPlatform",
  "com.apple.driver.AppleARMWatchdogTimer",
  "com.apple.driver.AppleMobileFileIntegrity",
  "com.apple.filesystems.apfs",
  "com.apple.iokit.IOStorageFamily",
  "com.apple.kec.Libm",
  "com.apple.kec.corecrypto",
  "com.apple.security.AppleImage4",
  "com.apple.security.sandbox",
]

[firmware]
# The T610YP platform files in edk2-sprd already contain the UniXNU FV entries.
# The board repository supplies the generic UniXNU and DarwinBoot packages.
config = "t610yp"
dsc = "Platform/YEPEN/ums512/t610yp/t610yp.dsc"
fd = "workspace/Build/t610yp/{target}_CLANG38/FV/UMS512_UEFI.fd"
packages = [
  "{uefi}",
  "{tree}/package",
  "{tree}/drivers/DarwinBoot",
  "{edk2}",
]

[payload]
volume = "T610YPESP"
size_mib = 64
loader = "firmware"
dram_size = "0x100000000"
kernel_args = ["-v", "serial=3", "debug=0x14e", "boot-progress=1", "armcpu-diagnostics=1"]

[payload.adt]
tool = "scripts/make-t610yp-adt.py"
# Expose all eight hardware cores. XNU uses the A55-compatible CPU model for
# this heterogeneous SoC, matching the existing platform bring-up convention.
cpu_regs = "0,0x1,0x100,0x101,0x102,0x103,0x104,0x105"
dram_size = "0x100000000"
owned_memory_size = "0x20000000"

[[bootimg.dtb_node]]
path = "/chosen"
props = [
  { name = "stdout-path", type = "s", value = "/soc/ap-apb/serial@70100000" },
]
